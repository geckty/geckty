version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the macOS binary
    deps:
      - task: common:go:mod:tidy
    # Deliberately no CGO_ENABLED=0: written when this project's Metal
    # backend was gio, which needed cgo on macOS. gogpu (the current
    # backend) advertises itself as cgo-free, so this may no longer be
    # necessary — unverified; see the project plan's "CI/release infra"
    # section.
    cmds:
      - |
        go build -trimpath -buildvcs=false \
          -ldflags="-w -s" \
          -o "{{.BIN_DIR}}/{{.APP_NAME}}" {{.MAIN_PACKAGE}}
    env:
      GOOS: darwin
      GOARCH: '{{.ARCH | default ARCH}}'

  build:arm64:
    summary: Builds a macOS arm64 binary
    cmds:
      - task: build
        vars:
          ARCH: arm64

  build:amd64:
    summary: Builds a macOS amd64 binary
    cmds:
      - task: build
        vars:
          ARCH: amd64

  package:
    summary: Packages the application into a .app bundle and DMG installer
    deps:
      - task: build
    cmds:
      - task: create:app:bundle
      - task: create:dmg

  create:app:bundle:
    summary: Creates an .app bundle
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/icons.icns"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  create:dmg:
    summary: Creates a DMG with drag-to-Applications layout
    cmds:
      - chmod +x build/darwin/create-dmg.sh
      - build/darwin/create-dmg.sh "{{.APP_NAME}}" "{{.ARCH | default ARCH}}" "{{.BIN_DIR}}"

  run:
    summary: Builds and runs a local .app bundle (ad hoc code-signed, matching package)
    deps:
      - task: build
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources/icons.icns"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'
