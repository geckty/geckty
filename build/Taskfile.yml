version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    # Cross-arch packaging tasks (e.g. darwin:build:universal) invoke this
    # concurrently from parallel deps; two `go mod tidy` processes racing
    # on go.mod can corrupt it.
    run: once
    cmds:
      - go mod tidy
