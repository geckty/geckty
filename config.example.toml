# geckty configuration.
#
# Copy this file to $XDG_CONFIG_HOME/geckty/config.toml (or
# ~/.config/geckty/config.toml if XDG_CONFIG_HOME is unset) and edit it.
# Any field or section left out falls back to geckty's built-in default.

[window]
width = 1000
height = 650

[font]
family = "monospace"
size = 13

[colors]
# preset, if set, replaces foreground/background/ansi below entirely with
# a named built-in scheme rather than merging with them — pick one or the
# other, not both.
#
# Built-in presets:
#   "glass" — geckty's standard / default theme. Approximates macOS
#             Terminal.app's dark "Pro" palette, paired with the tab bar's
#             own software glass capsules (see internal/ui/chrome/glass.go).
#             Colors only: gogpu's window API has no transparency/blur knob,
#             so this can't reproduce Terminal.app's translucent chrome via
#             real compositor blur.
preset = "glass"

# Leave the fields below commented when using a preset. Uncomment (and
# clear preset) to customize colors by hand — values match Terminal.app
# "Pro" (text/selection verified from the system profile).
# foreground = "#f4f4f4"
# background = "#000000"
# selection = "#525252"
# ansi = [
#   "#000000", "#c23621", "#25a250", "#caca33",
#   "#492ee1", "#d338d3", "#33bbc8", "#cbcccc",
#   "#818383", "#fc391f", "#31e722", "#eaec23",
#   "#5833ff", "#f935f8", "#14f0f0", "#e9ebeb",
# ]

[shell]
# Leave unset to use $SHELL (POSIX) or the best available PowerShell/cmd
# (Windows).
# command = ["/bin/zsh", "-l"]

[selection]
# Extra characters (beyond letters, digits, and "_", always included)
# treated as part of a word for double-click word selection. The default
# selects only "_"-joined identifiers; uncommenting a broader set below
# lets a double-click grab a whole kebab-case-name.ext or path in one go.
# Double-click word characters beyond letters/digits/"_" (Terminal.app-
# style filenames like config.example.toml).
word_chars = "._-"

[tabbar]
# hidden disables the tab bar entirely — no tab strip and no "+" button,
# regardless of show_threshold/plus_button below or how many tabs are open.
hidden = false
# show_threshold is the minimum number of open tabs before the tab strip
# (the row of tab pills) is shown. Default 2: a single tab has nothing to
# switch between, so — matching Terminal.app/iTerm2 — the strip only
# appears once a second tab exists. Set to 1 to always show it.
show_threshold = 2

[tabbar.plus_button]
# "+" button visibility is independent of the tab strip's own
# show_threshold above — e.g. keep "+" visible with a single tab open even
# though the strip itself stays hidden until a second one exists, or hide
# "+" entirely and rely on the new_tab keybinding instead.
hidden = false
show_threshold = 2

# Loads plugin directories (each containing a plugin.toml + its entry.wasm)
# at startup — see internal/plugin.Host. Empty by default: plugins are
# strictly opt-in, like every other off-by-default feature in geckty.
# plugins = ["/path/to/my-plugin"]

# Defining any [[keybindings]] entries replaces ALL of the built-in
# defaults, not just the ones listed — copy the defaults below and edit
# them rather than adding a single override.
#
# key: a gpucontext.Key name ("A".."Z", "0".."9", "Tab", "[", "]", ...)
# mods: any of "ctrl", "shift", "alt", "cmd" (cmd is macOS-only)
# action: "new_tab", "close_tab", "next_tab", "prev_tab", "copy", "paste"
#
# Defaults avoid plain Ctrl+T/Ctrl+W/Ctrl+C/Ctrl+V: those are shell
# readline/job-control bindings (transpose-char, delete-word-backward,
# SIGINT, literal-next) that must reach the shell untouched. macOS default
# (Cmd-based, matches Terminal.app/iTerm2):
#
# [[keybindings]]
# key = "T"
# mods = ["cmd"]
# action = "new_tab"
#
# [[keybindings]]
# key = "W"
# mods = ["cmd"]
# action = "close_tab"
#
# [[keybindings]]
# key = "]"
# mods = ["cmd", "shift"]
# action = "next_tab"
#
# [[keybindings]]
# key = "["
# mods = ["cmd", "shift"]
# action = "prev_tab"
#
# [[keybindings]]
# key = "C"
# mods = ["cmd"]
# action = "copy"
#
# [[keybindings]]
# key = "V"
# mods = ["cmd"]
# action = "paste"
#
# Other platforms default to Ctrl+Shift+T/W/C/V and Ctrl+(Shift+)Tab
# instead.
