coverage:
  precision: 2
  round: down
  range: "70...85"
  status:
    project:
      default:
        target: 85%
        threshold: 1%
    patch:
      default:
        target: 85%
        threshold: 1%

ignore:
  - "cmd/"
  - "scripts/"
  - "plugins/examples/"
  - "internal/plugin/testdata/"
  - "internal/ui/overlay/"
  - "internal/ui/backend.go"
  - "internal/ui/app/platform.go"
  - "internal/ui/chrome/tabbar_widget.go"
  - "internal/ui/termview/widget.go"
  - "internal/config/actions.go"
  - "assets/assets.go"
  # gogpu Run/onDraw/uploadAndPresent need a live GPU surface; uiState
  # helpers in this file are covered by internal/ui/app/*_test.go and
  # smoke-linux exercises Run end-to-end in CI.
  - "internal/ui/app/app.go"
  # desktop.Run compositor entrypoint — same GPU/window requirement as app.go.
  - "internal/ui/app/compositor.go"
  - "internal/pty/conpty_windows.go"
  - "internal/pty/env_windows.go"
  - "internal/pty/shell_windows.go"
  - "internal/pty/syscall_windows.go"
  - "internal/pty/pty.go"
  - "**/doc.go"
