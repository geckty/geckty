# Example theme file. Copy to ~/.config/geckty/themes/glass.toml
# (or next to your config.toml under themes/) and set:
#   theme = "glass"
# in config.toml. Inline [colors]/[ui] keys merge on top of this file.
#
# The binary ships the same file via assets/themes/glass.toml — this copy
# is for documentation and offline editing.

[colors]
foreground = "#f4f4f4"
background = "#1d1f22"
selection_background = "#525252"
ansi = [
  "#000000", "#c23621", "#25a250", "#caca33",
  "#492ee1", "#d338d3", "#33bbc8", "#cbcccc",
  "#818383", "#fc391f", "#31e722", "#eaec23",
  "#5833ff", "#f935f8", "#14f0f0", "#e9ebeb",
]

[ui]
visual_bell = "#ffffff55"
scrollbar_track = "#ffffff28"
scrollbar_thumb = "#ffffff70"
command_border_enabled = false
command_dot_enabled = false
content_brackets = "#ffffff55"

[ui.glass]
bar_lift = 0.06
inactive = 0.05
hover = 0.14
active = 0.30
drag = 0.22
plus_hover = 0.08
rim = 0.70
rim_alpha = 0.35
fill_alpha = 0.78
